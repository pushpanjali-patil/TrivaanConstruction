<app-page-banner
    title="OUR PROJECTS"
    subtitle="Home > Projects"
     backgroundImage="/images/projects/projects.jpg">
</app-page-banner>

<section class="projects-section">

    <div class="container">

        <app-section-title
            subtitle="OUR PROJECTS"
            title="Building Landmarks That Last">
        </app-section-title>

        <div class="row g-4 mt-4">

            @for(project of projects; track project.id){

                <div class="col-lg-4 col-md-6">

                    <app-project-card
                        [project]="project">
                    </app-project-card>

                </div>

            }

        </div>

    </div>

</section>
