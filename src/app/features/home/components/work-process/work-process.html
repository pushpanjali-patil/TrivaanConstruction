<section class="process-section" appRevealOnScroll>

  <div class="container">

    <app-section-title
      subtitle="OUR PROCESS"
      title="How We Deliver Successful Projects"
      description="From planning to project handover, every step is executed with precision.">
    </app-section-title>


    <div class="process-timeline">

      @for (step of steps(); track step.id; let i = $index) {

        <div class="process-step">

          <!-- Number -->
          <div class="step-number">
            {{ (i + 1).toString().padStart(2, '0') }}
          </div>

          <!-- Connector -->
          @if (i < steps().length - 1) {
            <div class="step-connector"></div>
          }

          <!-- Content -->
          <div class="process-content">

            <h3>
              {{ step.title }}
            </h3>

            <div class="step-line"></div>

            <p>
              {{ step.description }}
            </p>

          </div>

        </div>

      }

    </div>

  </div>

</section>
