<section class="contact-info py-5">

    <div class="container">

        <app-section-title
            subtitle="Get In Touch"
            title="We're Here to Help">
        </app-section-title>

        <div class="contact-card mt-5">

            @for (item of contactInfo; track item.id) {

                <div class="info-item">

                    <div class="icon">
                        <i [class]="item.icon"></i>
                    </div>

                    <div class="content">

                        <h5>{{ item.title }}</h5>

                        <h6>{{ item.value }}</h6>

                        <p>{{ item.description }}</p>

                    </div>

                </div>

            }

        </div>

    </div>

</section>
