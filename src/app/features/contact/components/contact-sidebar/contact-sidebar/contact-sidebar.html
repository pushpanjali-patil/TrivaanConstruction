<div class="sidebar">

    <span class="sidebar-subtitle">
        Office Location
    </span>

    <div class="map">

        <iframe
            [src]="mapUrl"
            loading="lazy"
            allowfullscreen
            referrerpolicy="no-referrer-when-downgrade">
        </iframe>

    </div>

    <div class="office-info">

        <div class="info-item">
            <i class="bi bi-geo-alt-fill"></i>
            <div>
                <h6>Office Address</h6>
                <p>Pune, Maharashtra</p>
            </div>
        </div>

        <div class="info-item">
            <i class="bi bi-telephone-fill"></i>
            <div>
                <h6>Call Us</h6>
                <p>+91 9511976895</p>
            </div>
        </div>

        <div class="info-item">
            <i class="bi bi-envelope-fill"></i>
            <div>
                <h6>Email</h6>
                <p>info@trivaanconstructions.com</p>
            </div>
        </div>

    </div>

    <div class="buttons">

        <a
            href="tel:+919511976895"
            class="btn btn-primary">

            Call Now

        </a>

        <a
            href="mailto:info@trivaanconstructions.com"
            class="btn btn-outline-primary">

            Email Us

        </a>

    </div>

</div>
