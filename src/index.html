<!doctype html>
<html lang="en">

<head>

  <meta charset="utf-8">

  <title>Trivaan Constructions</title>

  <base href="/">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <link
    rel="icon"
    type="image/x-icon"
    href="favicon.ico"
  >

  <!-- Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">

  <link
    rel="preconnect"
    href="https://fonts.gstatic.com"
    crossorigin
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=Montserrat:wght@400;500;600;700;800&display=swap"
    rel="stylesheet"
  >

  <!-- Initial Loader CSS -->
  <style>

    #initial-loader {
      position: fixed;
      inset: 0;

      width: 100%;
      height: 100%;

      z-index: 999999;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #ffffff;

      opacity: 1;
      visibility: visible;

      transition:
        opacity 0.3s ease,
        visibility 0.3s ease;
    }

    #initial-loader.loader-hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .initial-loader-content {
      width: 100%;
      max-width: 500px;

      padding: 30px 20px;

      text-align: center;
    }

    .initial-loader-logo {
      width: 180px;
      height: 180px;

      max-width: 45vw;
      max-height: 45vw;

      object-fit: contain;

      display: block;

      margin: 0 auto 20px;
    }

    .initial-company-name {
      margin-bottom: 10px;

      font-family: 'Montserrat', Arial, sans-serif;

      font-size: 30px;
      font-weight: 700;

      line-height: 1.2;
    }

    .initial-company-name .blue {
      color: #0b3d91;
    }

    .initial-company-name .orange {
      color: #f7931e;
    }

    .initial-tagline {
      margin: 0 0 28px;

      font-family: 'Inter', Arial, sans-serif;

      font-size: 14px;

      color: #6b7280;

      letter-spacing: 0.5px;
    }

    .initial-spinner {
      width: 40px;
      height: 40px;

      margin: 0 auto 12px;

      border: 4px solid #e5e7eb;

      border-top-color: #f7931e;

      border-radius: 50%;

      animation: initial-loader-spin 0.8s linear infinite;
    }

    .initial-loading-text {
      margin: 0;

      font-family: 'Inter', Arial, sans-serif;

      font-size: 11px;

      color: #6b7280;

      text-transform: uppercase;

      letter-spacing: 2px;
    }

    @keyframes initial-loader-spin {

      from {
        transform: rotate(0deg);
      }

      to {
        transform: rotate(360deg);
      }

    }

    @media (max-width: 576px) {

      .initial-loader-logo {
        width: 900px;
        height: 900px;
      }

      .initial-company-name {
        font-size: 24px;
      }

      .initial-tagline {
        font-size: 12px;
      }

      .initial-spinner {
        width: 34px;
        height: 34px;
      }

    }

  </style>

</head>

<body>

  <!-- Immediate loader -->
  <div id="initial-loader">

    <div class="initial-loader-content">

      <img
        class="initial-loader-logo"
        src="/images/about/logo5.jpg"
        alt="Trivaan Constructions"
      >

    </div>

  </div>

  <!-- Angular application -->
  <app-root></app-root>

</body>

</html>
